---
version: 2

# Only github-actions: the plugin is plain PHP with no npm or composer manifest, so an
# npm entry here would just report "no dependency files found" every Monday.
updates:
  - package-ecosystem: "github-actions"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    directory: "/.github/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
