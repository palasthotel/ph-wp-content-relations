name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: content-relations
      dev-plugin-name: Content Relations (DEV)
      build-command: npm ci && npm run build
      # What the plugin enqueues from the build, so a renamed or dropped entry point
      # fails here instead of leaving wp-admin without its sidebar or meta box.
      required-files: |
        dist/block-editor.js
        dist/block-editor.asset.php
        dist/meta-box.js
        dist/meta-box.asset.php
        dist/types-edit.js
        dist/types-edit.asset.php
        dist/types-edit.css
        languages/ph-content-relations-de_DE.mo
